    document.getElementById('btn-resume-ai').addEventListener('click', () => {
      const u = units.find((x) => x.uid === selectedUid);
      if (!u) return;
      u.manualHold = false;
      u.lockTimer = 0;
    });

    // Click 3D unit to select
    const raycaster = new THREE.Raycaster();
    const ptr = new THREE.Vector2();
    let downPt = { x: 0, y: 0 };
    renderer.domElement.addEventListener('pointerdown', (e) => { downPt = { x: e.clientX, y: e.clientY }; });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y) > 6) return;
      ptr.x = (e.clientX / window.innerWidth) * 2 - 1;
      ptr.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(ptr, camera);
      const hits = raycaster.intersectObjects(units.map((u) => u.group), true);
      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj && obj.parent !== scene) obj = obj.parent;
        const found = units.find((u) => u.group === obj);
        if (found) selectUnit(found.uid);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloomPass.resolution.set(window.innerWidth, window.innerHeight);
    });

    // -----------------------------------------------------------------------
    // 9. MAIN RENDER & SIMULATION LOOP
    // -----------------------------------------------------------------------
    const clock = new THREE.Clock();
    const statSurv = document.getElementById('stat-surv');
    const statEnm = document.getElementById('stat-enm');
    const statDist = document.getElementById('stat-dist');
    const tmpVec = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const rawDt = Math.min(0.05, clock.getDelta());
      let simDt = paused ? 0 : rawDt * timeScale;
      if (hitStopTimer > 0) {
        hitStopTimer = Math.max(0.0, hitStopTimer - rawDt);
        simDt = 0;
      }
      const dt = simDt;

      for (const u of units) updateUnitAI(u, dt);
      resolveUnitSeparation(dt);

      // Update death impact bursts, ballistic debris chunks, & expanding ground decals
      for (let i = pendingDeathImpacts.length - 1; i >= 0; i--) {
        const imp = pendingDeathImpacts[i];
        imp.timer -= dt;
        if (imp.timer <= 0) {
          pendingDeathImpacts.splice(i, 1);
          if (!imp.unit.dead) continue;
          const pos = new THREE.Vector3(
            imp.unit.group.position.x + imp.fwd.x * imp.shift,
            0.018,
            imp.unit.group.position.z + imp.fwd.z * imp.shift
          );
          const dustCol = imp.theme.dustColor || 0x9ca3af;
          const rMat = new THREE.MeshBasicMaterial({
            color: dustCol, side: THREE.DoubleSide, transparent: true, opacity: 0.56, depthWrite: false,
          });
          const ring = new THREE.Mesh(dustRingGeo, rMat);
          ring.rotation.x = -Math.PI / 2;
          ring.position.copy(pos);
          ring.scale.setScalar(0.45 * imp.theme.dustScale);
          scene.add(ring);
          deathDecals.push({
            kind: 'ring', mesh: ring, age: 0.0, maxLife: 0.46,
            startScale: 0.45 * imp.theme.dustScale, endScale: 2.35 * imp.theme.dustScale, baseOpacity: 0.56,
          });
          spawnBurstParticles(pos.clone().setY(0.10), null, [dustCol, 0x64748b], 8, 0.85, true);
          cameraShake = Math.max(cameraShake, imp.theme.shake);
          SFX.playDeathThud(imp.theme.shake);
        }
      }

      for (let i = deathParticles.length - 1; i >= 0; i--) {
        const dp = deathParticles[i];
        dp.life -= dt;
        if (dp.life <= 0) {
          scene.remove(dp.mesh);
          dp.mesh.material.dispose();
          deathParticles.splice(i, 1);
          continue;
        }
        if (dt > 0) {
          dp.vy -= (dp.lowDust ? 4.2 : 14.5) * dt;
          dp.mesh.position.x += dp.vx * dt;
          dp.mesh.position.y += dp.vy * dt;
          dp.mesh.position.z += dp.vz * dt;
          dp.mesh.rotation.x += dp.rx * dt;
          dp.mesh.rotation.y += dp.ry * dt;
          if (dp.mesh.position.y < 0.032) {
            dp.mesh.position.y = 0.032;
            dp.vy = Math.abs(dp.vy) * 0.24;
            dp.vx *= 0.52;
            dp.vz *= 0.52;
            dp.rx *= 0.4;
            dp.ry *= 0.4;
          }
          const frac = dp.life / dp.maxLife;
          if (dp.lowDust) {
            dp.mesh.material.opacity = 0.72 * frac;
            dp.mesh.scale.setScalar(dp.baseScale * (1.0 + (1.0 - frac) * 0.75));
          } else if (frac < 0.28) {
            dp.mesh.scale.setScalar(dp.baseScale * Math.max(0.05, frac / 0.28));
          }
        }
      }

      for (let i = deathDecals.length - 1; i >= 0; i--) {
        const dd = deathDecals[i];
        if (dt > 0) dd.age += dt;
        if (dd.kind === 'puddle') {
          const p = Math.min(1.0, dd.age / dd.growDur);
          const ease = 1.0 - Math.pow(1.0 - p, 3.0);
          dd.mesh.scale.setScalar(0.22 + (dd.targetScale - 0.22) * ease);
        } else {
          const p = Math.min(1.0, dd.age / dd.maxLife);
          dd.mesh.scale.setScalar(dd.startScale + (dd.endScale - dd.startScale) * p);
          dd.mesh.material.opacity = dd.baseOpacity * (1.0 - p);
          if (dd.age >= dd.maxLife) {
            scene.remove(dd.mesh);
            dd.mesh.material.dispose();
            deathDecals.splice(i, 1);
          }
        }
      }

      // Update timed VFX
      for (let i = activeVfx.length - 1; i >= 0; i--) {
        const v = activeVfx[i];
        v.life -= rawDt * timeScale;
        if (v.life <= 0) {
          scene.remove(v.mesh);
          activeVfx.splice(i, 1);
        }
      }

      // Update projectiles
      for (let i = activeProjectiles.length - 1; i >= 0; i--) {
        const p = activeProjectiles[i];
        const step = p.speed * dt;
        p.mesh.position.addScaledVector(p.dir, step);
        p.distLeft -= step;
        if (p.distLeft <= 0) {
          scene.remove(p.mesh);
          activeProjectiles.splice(i, 1);
          if (p.onImpact) p.onImpact();
        }
      }

      // Telemetry + Distance Ruler + Result check
      const aliveSurv = units.filter((u) => u.team === 'survivor' && !u.dead);
      const aliveEnm = units.filter((u) => u.team === 'enemy' && !u.dead);
      statSurv.textContent = `Survivor: ${aliveSurv.length}`;
      statEnm.textContent = `Monster/Zombie: ${aliveEnm.length}`;

      let minPairDist = Infinity;
      let pairA = null, pairB = null;
      for (const s of aliveSurv) {
        for (const e of aliveEnm) {
          const d = s.group.position.distanceTo(e.group.position);
          if (d < minPairDist) { minPairDist = d; pairA = s; pairB = e; }
        }
      }
      statDist.textContent = pairA ? `Jarak Terdekat: ${minPairDist.toFixed(2)} m` : 'Jarak Terdekat: -';

      rulerLine.visible = chkRuler.checked && Boolean(pairA && pairB);
      if (rulerLine.visible) {
        const posArr = rulerLine.geometry.attributes.position;
        posArr.setXYZ(0, pairA.group.position.x, 0.05, pairA.group.position.z);
        posArr.setXYZ(1, pairB.group.position.x, 0.05, pairB.group.position.z);
        posArr.needsUpdate = true;
      }

      if (!battleOver && units.length >= 2 && (aliveSurv.length === 0 || aliveEnm.length === 0) && selCombatMode.value === 'battle') {
        const hasSurvTeam = units.some((u) => u.team === 'survivor');
        const hasEnmTeam = units.some((u) => u.team === 'enemy');
        if (hasSurvTeam && hasEnmTeam) {
          battleOver = true;
          document.getElementById('result-title').textContent = aliveSurv.length > 0 ? '🏆 Survivor Menang!' : '💀 Zombie / Monster Menang!';
          document.getElementById('result-sub').textContent = `Tersisa ${aliveSurv.length} Survivor vs ${aliveEnm.length} Monster/Zombie`;
          resultBanner.classList.add('show');
        }
      }

      // Selection ring & follow camera
      const selU = units.find((u) => u.uid === selectedUid);
      if (selU) {
        selectRing.visible = true;
        selectRingMat.color.setHex(selU.dead ? 0xef4444 : 0x38bdf8);
        selectRing.position.set(selU.group.position.x, 0.015, selU.group.position.z);
        selectRing.scale.setScalar(selU.ringScale || 1.0);
        if (followCam) {
          controls.target.lerp(tmpVec.copy(selU.group.position).add(new THREE.Vector3(0, 1.0, 0)), 0.12);
        }
      } else {
        selectRing.visible = false;
      }

      // Project 3D -> 2D HUD Labels & Floating Damage
      const showHud = chkHud.checked;
      for (const u of units) {
        if (!showHud) { u.hudEl.style.display = 'none'; continue; }
        let anchorH = u.height + 0.30;
        let hudAlpha = '';
        if (u.dead) {
          const dropT = Math.min(1.0, u.deadTimer / 0.75);
          anchorH = THREE.MathUtils.lerp(u.height + 0.30, 0.65, dropT);
          if (u.uid !== selectedUid) {
            if (u.deadTimer >= 2.4) { u.hudEl.style.display = 'none'; continue; }
            if (u.deadTimer > 1.6) hudAlpha = `${Math.max(0.0, 0.55 * (1.0 - (u.deadTimer - 1.6) / 0.8))}`;
            else hudAlpha = '0.55';
          } else {
            hudAlpha = '0.68';
          }
        }
        tmpVec.copy(u.group.position).add(new THREE.Vector3(0, anchorH, 0));
        tmpVec.project(camera);
        if (tmpVec.z > 1) {
          u.hudEl.style.display = 'none';
        } else {
          u.hudEl.style.display = 'block';
          u.hudEl.style.opacity = hudAlpha;
          u.hudEl.style.left = `${(tmpVec.x * 0.5 + 0.5) * window.innerWidth}px`;
          u.hudEl.style.top = `${(-tmpVec.y * 0.5 + 0.5) * window.innerHeight}px`;
          u.stateEl.textContent = u.stateText;
          u.hpFillEl.style.width = `${Math.max(0, (u.hp / u.maxHp) * 100)}%`;
        }
      }

      for (let i = floatDmgs.length - 1; i >= 0; i--) {
        const fd = floatDmgs[i];
        fd.life -= rawDt;
        fd.pos.y += 1.2 * rawDt;
        if (fd.life <= 0) {
          fd.el.remove();
          floatDmgs.splice(i, 1);
          continue;
        }
        tmpVec.copy(fd.pos).project(camera);
        fd.el.style.left = `${(tmpVec.x * 0.5 + 0.5) * window.innerWidth}px`;
        fd.el.style.top = `${(-tmpVec.y * 0.5 + 0.5) * window.innerHeight}px`;
        fd.el.style.opacity = `${Math.max(0, fd.life / fd.maxLife)}`;
      }

      const tNow = performance.now() * 0.001;
      skyUniforms.uTime.value = tNow;
      if (skyDome.visible) {
        skyDome.position.set(camera.position.x, 0, camera.position.z);
      }

      if (selEnvMode.value === 'apocalypse' && envGroup.visible) {
        const wPreset = WEATHER_PRESETS[activeWeatherId] || WEATHER_PRESETS.apoc_morning;
        // Fire barrel flicker + halo pulse
        const fBase = wPreset.fireInt;
        const flickW = fBase * (0.86 + 0.14 * Math.sin(tNow * 8.2) + 0.08 * Math.sin(tNow * 19.7));
        const flickE = fBase * (0.86 + 0.14 * Math.cos(tNow * 8.9) + 0.08 * Math.sin(tNow * 21.3));
        fireLightW.intensity = flickW;
        fireLightE.intensity = flickE;
        const fHalo = wPreset.fireHaloAlpha ?? 0.30;
        const glowScale = Math.max(0.25, fBase);
        fireHaloW.material.opacity = fHalo * (0.78 + 0.22 * (flickW / glowScale));
        fireHaloE.material.opacity = fHalo * (0.78 + 0.22 * (flickE / glowScale));
        const haloSc = 2.1 + 0.24 * Math.sin(tNow * 12.0);
        fireHaloW.scale.set(haloSc, haloSc, 1);
        fireHaloE.scale.set(haloSc * 0.96, haloSc * 0.96, 1);

        // Streetlamp ground pools & cones (hidden in daytime, active in sunset/storm; east sputters)
        const sputter = Math.sin(tNow * 17.0) * Math.sin(tNow * 31.3) > 0.56 ? 0.20 : 1.0;
        if (lampPoolW.visible) {
          lampPoolMatW.opacity = wPreset.lampAlpha;
          lampPoolMatE.opacity = wPreset.lampAlpha * sputter;
        }
        if (lampConeW.visible) {
          coneMatW.opacity = wPreset.coneAlpha;
          coneMatE.opacity = wPreset.coneAlpha * sputter;
        }

        // Lightweight lightning flash via existing rimLight + hemi + sky shader (no extra directional light)
        if (wPreset.lightning && chkWeather.checked) {
          lightningState.timer -= rawDt;
          if (lightningState.timer <= 0) {
            lightningState.flash = 1.0;
            lightningState.timer = 5.2 + Math.random() * 6.5;
          }
          if (lightningState.flash > 0.001) {
            lightningState.flash = Math.max(0.0, lightningState.flash - rawDt * 3.0);
            const pulse = lightningState.flash > 0.55
              ? 1.0
              : Math.sin(lightningState.flash * 26.0) * 0.45 + lightningState.flash * 0.7;
            const fp = Math.max(0.0, pulse);
            skyUniforms.uFlash.value = fp;
            rimLight.intensity = wPreset.rimInt + fp * 2.2;
            hemi.intensity = wPreset.hemiInt + fp * 0.85;
            scene.environmentIntensity = wPreset.envInt + fp * 0.95;
          } else {
            skyUniforms.uFlash.value = 0.0;
            rimLight.intensity = wPreset.rimInt;
            hemi.intensity = wPreset.hemiInt;
            scene.environmentIntensity = wPreset.envInt;
          }
        } else {
          skyUniforms.uFlash.value = 0.0;
        }

        // Batched smoke plumes, minimal background haze & lightweight weather particles
        if (atmosphereGroup.visible && chkWeather.checked) {
          const smArr = smokeGeo.attributes.position.array;
          for (let i = 0; i < SMOKE_COUNT; i++) {
            const sp = smokeMeta[i];
            sp.age += rawDt;
            if (sp.age >= sp.maxAge) sp.age = 0;
            const p = sp.age / sp.maxAge;
            const em = sp.emitter;
            const sway = Math.sin(tNow * 1.4 + p * 4.0) * 0.25 * p;
            smArr[i * 3 + 0] = em.x + sp.vx * sp.age + sway;
            smArr[i * 3 + 1] = em.y + sp.age * 1.15;
            smArr[i * 3 + 2] = em.z + sp.vz * sp.age;
          }
          smokeGeo.attributes.position.needsUpdate = true;

          for (const ml of mistLayers) {
            ml.sprite.position.x += ml.spd * rawDt;
            if (ml.sprite.position.x > 34) ml.sprite.position.x = -34;
            ml.sprite.material.opacity = ml.baseAlpha * wPreset.mistAlpha;
          }

          if (rainLines.visible) {
            const arr = rainGeo.attributes.position.array;
            for (let i = 0; i < RAIN_COUNT; i++) {
              const s3 = i * 3;
              let rx = rainSeeds[s3] + 2.8 * rawDt;
              let ry = rainSeeds[s3 + 1] - 20.0 * rawDt;
              let rz = rainSeeds[s3 + 2] + 0.7 * rawDt;
              if (ry < 0.0) {
                ry = 13.5 + Math.random() * 1.5;
                rx = (Math.random() - 0.5) * 40;
                rz = (Math.random() - 0.5) * 24;
              }
              if (rx > 20) rx -= 40;
              rainSeeds[s3] = rx; rainSeeds[s3 + 1] = ry; rainSeeds[s3 + 2] = rz;
              const i6 = i * 6;
              arr[i6] = rx; arr[i6 + 1] = ry; arr[i6 + 2] = rz;
              arr[i6 + 3] = rx - 0.10; arr[i6 + 4] = ry + 0.78; arr[i6 + 5] = rz - 0.03;
            }
            rainGeo.attributes.position.needsUpdate = true;
          }

          const drawN = Math.min(PARTICLE_MAX, wPreset.particleCount);
          const pArr = partGeo.attributes.position.array;
          for (let i = 0; i < drawN; i++) {
            const m = partMeta[i];
            const i3 = i * 3;
            let px = pArr[i3], py = pArr[i3 + 1], pz = pArr[i3 + 2];
            if (wPreset.particleMode === 'embers') {
              py += m.spdY * 1.45 * rawDt;
              px += (0.35 + Math.sin(tNow * 2.1 + m.phase) * 0.45) * rawDt;
              pz += Math.cos(tNow * 1.7 + m.phase) * 0.25 * rawDt;
              if (py > 5.8) {
                const bx = m.barrelIdx === 0 ? -4.4 : 4.6;
                const bz = m.barrelIdx === 0 ? -3.65 : -3.75;
                px = bx + (Math.random() - 0.5) * 0.45;
                py = 0.95 + Math.random() * 0.25;
                pz = bz + (Math.random() - 0.5) * 0.45;
              }
            } else if (wPreset.particleMode === 'spores') {
              py += Math.sin(tNow * 1.3 + m.phase) * 0.35 * rawDt + 0.08 * rawDt;
              px += m.spdX * 0.55 * rawDt;
              pz += Math.cos(tNow * 0.9 + m.phase) * 0.35 * rawDt;
              if (px > 18) px = -18;
              if (py > 6.2 || py < 0.15) py = 0.4 + Math.random() * 4.5;
            } else {
              // ash_embers: gently drifting embers & ash flakes across avenue
              py += (i % 3 === 0 ? m.spdY * 0.75 : -m.spdY * 0.42) * rawDt;
              px += m.spdX * 1.15 * rawDt;
              pz += Math.sin(tNow * 1.2 + m.phase) * 0.25 * rawDt;
              if (px > 18) px = -18;
              if (py < 0.05) { py = 5.5 + Math.random() * 1.5; px = (Math.random() - 0.5) * 34; }
              if (py > 6.8) { py = 0.4; px = (i % 2 === 0 ? -4.4 : 4.6) + (Math.random() - 0.5) * 2.0; }
            }
            pArr[i3] = px; pArr[i3 + 1] = py; pArr[i3 + 2] = pz;
          }
          partGeo.attributes.position.needsUpdate = true;
        }
      }

      if (combatFlash.timer > 0) {
        combatFlash.timer = Math.max(0.0, combatFlash.timer - rawDt);
        combatFlashLight.intensity = combatFlash.maxInt * (combatFlash.timer / combatFlash.dur);
      } else if (combatFlashLight.intensity > 0) {
        combatFlashLight.intensity = 0;
      }

      controls.update();
      if (cameraShake > 0.002) {
        _shakeVec.set(
          (Math.random() - 0.5) * cameraShake,
          (Math.random() - 0.5) * cameraShake * 0.65,
          (Math.random() - 0.5) * cameraShake
        );
        camera.position.add(_shakeVec);
        controls.target.addScaledVector(_shakeVec, 0.35);
        cameraShake = Math.max(0.0, cameraShake - rawDt * 0.85);
      } else {
        _shakeVec.set(0, 0, 0);
        cameraShake = 0.0;
      }
      if (chkBloom && chkBloom.checked) composer.render();
      else renderer.render(scene, camera);
      if (_shakeVec.lengthSq() > 0) {
        camera.position.sub(_shakeVec);
        controls.target.addScaledVector(_shakeVec, -0.35);
      }
    }

    animate();

    // Boot with default duel: Jake vs Bile Juggernaut in Apocalypse Street at 12m distance
    if (window.location.protocol !== 'file:') {
      setEnvironmentMode('apocalypse');
      loadPreset('jake_vs_bile');
    }
  </script>
</body>
</html>
