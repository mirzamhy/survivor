<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survivor vs Zombies &amp; Mutants — 3D Battle Arena</title>
  <style>
    :root {
      --bg: #0f1319;
      --panel: rgba(17, 22, 30, 0.90);
      --panel-border: rgba(255, 255, 255, 0.10);
      --accent: #38bdf8;
      --survivor: #22c55e;
      --zombie: #f59e0b;
      --mutant: #ef4444;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      user-select: none;
    }
    #canvas-wrap {
      position: fixed; inset: 0; z-index: 1;
    }
    #vignette-overlay {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 62%, rgba(10, 14, 22, 0.22) 100%);
    }
    canvas { display: block; width: 100%; height: 100%; }

    /* Floating HTML Labels over 3D units */
    #labels-layer {
      position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden;
    }
    .unit-hud {
      position: absolute;
      transform: translate(-50%, -100%);
      background: rgba(10, 14, 20, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      padding: 4px 7px;
      min-width: 108px;
      text-align: center;
      backdrop-filter: blur(4px);
      transition: opacity 0.15s;
    }
    .unit-hud.selected {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.45);
    }
    .unit-hud.dead { opacity: 0.45; }
    .unit-name {
      font-size: 11px; font-weight: 700; letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .unit-state {
      font-size: 10px; color: var(--muted); margin-bottom: 3px;
      white-space: nowrap;
    }
    .hp-track {
      width: 100%; height: 5px; background: rgba(255,255,255,0.12);
      border-radius: 3px; overflow: hidden;
    }
    .hp-fill { height: 100%; transition: width 0.12s; }
    .hp-fill.survivor { background: var(--survivor); }
    .hp-fill.zombie { background: var(--zombie); }
    .hp-fill.mutant { background: var(--mutant); }

    .float-dmg {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 800; font-size: 14px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      pointer-events: none;
    }

    /* Top HUD Bar */
    #topbar {
      position: fixed; top: 12px; left: 336px; right: 14px; z-index: 10;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      pointer-events: none;
      transition: left 0.2s ease;
    }
    body.sidebar-collapsed #topbar { left: 62px; }
    .top-pill {
      pointer-events: auto;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 10px; padding: 8px 14px; backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .badge {
      padding: 3px 8px; border-radius: 999px; font-weight: 700; font-size: 11px;
      background: rgba(255,255,255,0.08);
    }
    .badge.surv { color: #86efac; background: rgba(34,197,94,0.16); border: 1px solid rgba(34,197,94,0.3); }
    .badge.enm { color: #fca5a5; background: rgba(239,68,68,0.16); border: 1px solid rgba(239,68,68,0.3); }
    .badge.dist { color: #7dd3fc; background: rgba(56,189,248,0.16); border: 1px solid rgba(56,189,248,0.3); }

    /* Left Sidebar */
    #sidebar {
      position: fixed; top: 12px; left: 12px; bottom: 12px; width: 312px; z-index: 12;
      background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 12px; backdrop-filter: blur(10px);
      display: flex; flex-direction: column;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      transition: transform 0.2s ease;
    }
    body.sidebar-collapsed #sidebar { transform: translateX(-330px); }
    #toggle-sidebar {
      position: fixed; top: 14px; left: 14px; z-index: 15;
      display: none; padding: 8px 11px; border-radius: 8px;
      background: var(--panel); border: 1px solid var(--panel-border); color: var(--text);
      cursor: pointer; font-weight: 700;
    }
    body.sidebar-collapsed #toggle-sidebar { display: block; }

    .sb-head {
      padding: 12px 14px; border-bottom: 1px solid var(--panel-border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .sb-title { font-size: 14px; font-weight: 800; color: #f8fafc; }
    .sb-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .sb-scroll {
      flex: 1; overflow-y: auto; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .sb-scroll::-webkit-scrollbar { width: 6px; }
    .sb-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    .section {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 9px; padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .sec-title {
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px;
      color: var(--accent); display: flex; justify-content: space-between; align-items: center;
    }
    label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; }
    select, input[type="range"] { width: 100%; }
    select {
      background: #171e29; color: var(--text);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px; padding: 6px 8px; font-size: 12px;
      outline: none;
    }
    select:focus { border-color: var(--accent); }
    .row { display: flex; gap: 6px; align-items: center; }
    .row > * { flex: 1; }

    button {
      background: #1e293b; color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 6px; padding: 7px 10px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background 0.14s, border-color 0.14s, transform 0.08s;
    }
    button:hover { background: #293548; border-color: rgba(255,255,255,0.28); }
    button:active { transform: scale(0.98); }
    button.primary { background: #0284c7; border-color: #38bdf8; color: #fff; }
    button.primary:hover { background: #0369a1; }
    button.good { background: #15803d; border-color: #22c55e; color: #fff; }
    button.good:hover { background: #166534; }
    button.danger { background: #991b1b; border-color: #ef4444; color: #fff; }
    button.danger:hover { background: #7f1d1d; }
    button.sm { padding: 4px 8px; font-size: 11px; }

    .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .preset-grid button { font-size: 11px; padding: 6px 6px; text-align: left; }

    .roster-list { display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow-y: auto; }
    .roster-item {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      padding: 5px 7px; border-radius: 6px; background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.06); cursor: pointer;
    }
    .roster-item.selected { border-color: var(--accent); background: rgba(56,189,248,0.12); }
    .roster-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .roster-dot.survivor { background: var(--survivor); }
    .roster-dot.zombie { background: var(--zombie); }
    .roster-dot.mutant { background: var(--mutant); }

    .check-row {
      display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text); cursor: pointer;
    }
    .check-row input { accent-color: var(--accent); cursor: pointer; }

    /* Bottom camera bar */
    #cam-bar {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 6px; background: var(--panel);
      border: 1px solid var(--panel-border); border-radius: 10px;
      padding: 6px 10px; backdrop-filter: blur(8px);
    }

    /* Battle Winner Banner */
    #result-banner {
      position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 14;
      display: none; align-items: center; gap: 14px;
      background: rgba(15, 23, 42, 0.94); border: 2px solid var(--accent);
      border-radius: 12px; padding: 12px 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }
    #result-banner.show { display: flex; }

    /* Loading & Protocol Warning Toast */
    #toast {
      position: fixed; bottom: 64px; right: 16px; z-index: 20;
      background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 9px 14px; max-width: 380px;
      font-size: 12px; display: none;
    }
    #toast.show { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="vignette-overlay"></div>
  <div id="labels-layer"></div>

  <button id="toggle-sidebar" title="Buka Panel Kontrol">☰ Menu</button>

  <aside id="sidebar">
    <div class="sb-head">
      <div>
        <div class="sb-title">3D Battle Arena</div>
        <div class="sb-sub">Survivor vs Zombies &amp; Mutants</div>
      </div>
      <button id="btn-collapse" class="sm" title="Sembunyikan Panel">✕</button>
    </div>

    <div class="sb-scroll">
      <!-- 1. Preset Duel & Squad -->
      <div class="section">
        <div class="sec-title">Preset Cepat</div>
        <div class="preset-grid">
          <button data-preset="jake_vs_bile">Jake vs Bile Tank</button>
          <button data-preset="rico_katana_vs_scythe">Rico [Katana] vs Scythe</button>
          <button data-preset="tom_axe_vs_bile">Tom [Fire Axe] vs Bile Tank</button>
          <button data-preset="lena_machete_vs_zombies">Lena [Machete] vs Zombies</button>
          <button data-preset="maya_vs_arachnid">Maya vs Arachnid Maw</button>
          <button data-preset="lena_vs_thorn">Lena vs Thorn Shroud</button>
          <button data-preset="tom_vs_rafflesia">Tom vs Rafflesia</button>
          <button data-preset="squad_vs_mutants">5 Survivor vs 5 Mutant</button>
          <button data-preset="squad_vs_zombies">5 Survivor vs 6 Zombie</button>
        </div>
      </div>

      <!-- 2. Pengaturan Jarak & Pertarungan -->
      <div class="section">
        <div class="sec-title">
          <span>Jarak &amp; Pertempuran</span>
          <span id="dist-val" style="color:#f8fafc;">12 m</span>
        </div>
        <div>
          <label for="slider-distance">Jarak Awal Survivor ↔ Monster (agar jalan mendekat)</label>
          <input id="slider-distance" type="range" min="3" max="24" step="1" value="12" />
        </div>
        <div class="row">
          <button id="btn-apply-dist" class="primary">Reset Posisi &amp; Jalan</button>
          <button id="btn-clear-all" class="danger">Kosongkan</button>
        </div>
        <div>
          <label for="sel-surv-behavior">Perilaku Survivor</label>
          <select id="sel-surv-behavior">
            <option value="hold">Diam &amp; Tembak di Tempat (Hold Stance)</option>
            <option value="advance">Maju Mendekati Musuh (Advance)</option>
          </select>
        </div>
        <div>
          <label for="sel-combat-mode">Mode Arena</label>
          <select id="sel-combat-mode">
            <option value="battle">Pertempuran Normal (HP &amp; Death)</option>
            <option value="immortal">Uji Animasi Abadi (Tak Bisa Mati)</option>
          </select>
        </div>
        <div>
          <label for="sel-env-mode">Lingkungan Arena</label>
          <select id="sel-env-mode">
            <option value="apocalypse">Jalanan Apocalypse 3D (Bangunan, Tanah Retak &amp; Rumput)</option>
            <option value="studio">Grid Studio Polos</option>
          </select>
        </div>
        <div>
          <label for="sel-weather">Suasana &amp; Pencahayaan Dunia</label>
          <select id="sel-weather">
            <option value="apoc_morning" selected>Pagi Berkabut Apocalypse (Terang &amp; Jelas)</option>
            <option value="apoc_noon">Siang Cerah Berdebu (Detail Maksimal)</option>
            <option value="apoc_overcast">Siang Mendung Berkabut (Silent Hill)</option>
            <option value="apoc_sunset">Sore Senja Emas (Golden Hour)</option>
            <option value="storm_rain">Mendung Hujan Ringan (Storm Terang)</option>
          </select>
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <label for="slider-brightness" style="margin-bottom:0;">Kecerahan (Brightness)</label>
            <span id="bright-val" style="font-size:11px;font-weight:700;color:#f8fafc;">1.12x</span>
          </div>
          <input id="slider-brightness" type="range" min="0.75" max="1.75" step="0.05" value="1.12" />
        </div>
        <label class="check-row"><input id="chk-vfx" type="checkbox" checked /> Tampilkan Efek 3D (VFX Serangan &amp; Tembakan)</label>
        <label class="check-row"><input id="chk-hud" type="checkbox" checked /> Tampilkan Bar HP &amp; Status di Atas Kepala</label>
        <label class="check-row"><input id="chk-ruler" type="checkbox" checked /> Tampilkan Garis Ukur Jarak</label>
        <label class="check-row"><input id="chk-weather" type="checkbox" checked /> Efek Cuaca, Kabut &amp; Partikel Ringan</label>
        <label class="check-row"><input id="chk-bloom" type="checkbox" checked /> Efek Bloom / Glow Emissive (Ringan)</label>
        <label class="check-row"><input id="chk-sfx" type="checkbox" checked /> Efek Suara Pertempuran (Web Audio)</label>
      </div>

      <!-- 3. Tambah Karakter -->
      <div class="section">
        <div class="sec-title">Tambah Karakter ke Arena</div>
        <div>
          <label for="sel-survivor">Pilih Survivor (10 Model)</label>
          <select id="sel-survivor"></select>
        </div>
        <div>
          <label for="sel-weapon">Senjata Survivor</label>
          <select id="sel-weapon"></select>
        </div>
        <button id="btn-add-survivor" class="good">+ Tambah Survivor (Sisi Kiri)</button>

        <hr style="border:0;border-top:1px solid rgba(255,255,255,0.08);margin:4px 0;" />

        <div>
          <label for="sel-enemy">Pilih Zombie / Monster Mutant (11 Model)</label>
          <select id="sel-enemy"></select>
        </div>
        <button id="btn-add-enemy" class="danger">+ Tambah Zombie / Mutant (Sisi Kanan)</button>
      </div>

      <!-- 4. Daftar Unit & Kontrol Animasi -->
      <div class="section">
        <div class="sec-title">
          <span>Unit Aktif</span>
          <span id="unit-count" style="color:var(--muted);">0</span>
        </div>
        <div id="roster-list" class="roster-list"></div>

        <div id="inspector-box" style="display:none; flex-direction:column; gap:6px; margin-top:4px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.08);">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
            <span style="font-size:11px;font-weight:700;color:#f8fafc;">Terpilih: <span id="insp-name" style="color:var(--accent);">-</span></span>
            <button id="btn-resume-ai" class="sm good" style="flex:0 0 auto;">▶ AI Otomatis</button>
          </div>
          <details style="font-size:11px;color:var(--muted);">
            <summary style="cursor:pointer;padding:2px 0;">Opsional: Uji Clip Manual</summary>
            <div style="display:flex;flex-direction:column;gap:5px;margin-top:6px;">
              <div class="row">
                <button class="sm" data-anim-role="idle">Idle</button>
                <button class="sm" data-anim-role="walk">Walk</button>
                <button class="sm" data-anim-role="run">Run</button>
                <button class="sm" data-anim-role="attack">Attack</button>
              </div>
              <div class="row">
                <button class="sm" data-anim-role="skill">Skill</button>
                <button class="sm" data-anim-role="hit">Hit</button>
                <button class="sm" data-anim-role="death">Death</button>
              </div>
              <div class="row">
                <select id="sel-raw-clip"></select>
                <button id="btn-play-raw" class="sm primary" style="flex:0 0 auto;">Putar</button>
              </div>
            </div>
          </details>
        </div>
      </div>
    </div>
  </aside>

  <!-- Top Controls & Telemetry -->
  <div id="topbar">
    <div class="top-pill">
      <span id="stat-surv" class="badge surv">Survivor: 0</span>
      <span id="stat-enm" class="badge enm">Monster/Zombie: 0</span>
      <span id="stat-dist" class="badge dist">Jarak Terdekat: -</span>
    </div>
    <div class="top-pill">
      <button id="btn-pause" class="sm primary">⏸ Jeda</button>
      <div style="display:flex;align-items:center;gap:6px;width:130px;">
        <span style="font-size:11px;color:var(--muted);">Speed</span>
        <input id="slider-speed" type="range" min="0.25" max="2.0" step="0.25" value="1.0" />
        <span id="speed-val" style="font-size:11px;min-width:30px;">1.0x</span>
      </div>
    </div>
  </div>

  <!-- Result Banner -->
  <div id="result-banner">
    <div>
      <div id="result-title" style="font-size:16px;font-weight:800;">Pertempuran Selesai!</div>
      <div id="result-sub" style="font-size:12px;color:var(--muted);">-</div>
    </div>
    <button id="btn-rematch" class="primary">↺ Ulangi Pertarungan</button>
  </div>

  <!-- Camera Presets -->
  <div id="cam-bar">
    <button class="sm" data-cam="arena">🎥 Arena 3/4</button>
    <button class="sm" data-cam="side">📏 Samping (Jarak)</button>
    <button class="sm" data-cam="close">🔍 Dekat Duel</button>
    <button class="sm" data-cam="follow">🎯 Ikuti Terpilih</button>
  </div>

  <div id="toast"></div>

      varying vec3 vWorldDir;

    `;

    const skyFragBody = /* glsl */`
      uniform vec3 uTopColor;
      uniform vec3 uMidColor;
      uniform vec3 uHorizonColor;
      uniform vec3 uGroundColor;
      uniform vec3 uSunColor;
      uniform vec3 uSunDir;
      uniform float uSunSize;
      uniform vec3 uCloudColor;
      uniform float uCloudIntensity;
      uniform float uTime;
      uniform float uFlash;
      varying vec3 vWorldDir;

      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }
      float noise2(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash21(i);
        float b = hash21(i + vec2(1.0, 0.0));
        float c = hash21(i + vec2(0.0, 1.0));
        float d = hash21(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      void main() {
        vec3 dir = normalize(vWorldDir);
        float h = clamp(dir.y, -1.0, 1.0);
        vec3 col;
        if (h >= 0.0) {
          float tMid = smoothstep(0.0, 0.24, h);
          float tTop = smoothstep(0.18, 0.78, h);
          col = mix(uHorizonColor, uMidColor, tMid);
          col = mix(col, uTopColor, tTop);
        } else {
          col = mix(uHorizonColor, uGroundColor, smoothstep(0.0, -0.25, h));
        }

        float sunDot = max(dot(dir, normalize(uSunDir)), 0.0);
        float halo = pow(sunDot, 10.0) * 0.42 + pow(sunDot, 48.0) * 0.55;
        float disc = smoothstep(cos(uSunSize * 1.45), cos(uSunSize * 0.65), sunDot);
        if (h > -0.04) {
          float vis = smoothstep(-0.04, 0.06, h);
          col += uSunColor * (halo * 0.65 + disc * 1.15) * vis;
        }

        // Lightweight 2-octave drifting cloud wisps
        if (dir.y > 0.01 && uCloudIntensity > 0.01) {
          vec2 uv = dir.xz / (dir.y + 0.18);
          vec2 wind = vec2(uTime * 0.014, uTime * 0.005);
          float c1 = noise2(uv * 0.90 + wind);
          float c2 = noise2(uv * 2.10 - wind * 1.4 + vec2(4.2, 1.9));
          float cloudMask = smoothstep(0.46, 0.84, c1 * 0.65 + c2 * 0.35);
          float elevFade = smoothstep(0.01, 0.22, dir.y) * smoothstep(0.96, 0.30, dir.y);
          vec3 cloudCol = mix(uCloudColor, uSunColor * 0.92, pow(sunDot, 6.0) * 0.40);
          cloudCol += vec3(0.55, 0.72, 1.0) * uFlash * (0.45 + 0.55 * c2);
          col = mix(col, cloudCol, cloudMask * elevFade * uCloudIntensity);
        }

        col += vec3(0.28, 0.38, 0.56) * uFlash * smoothstep(-0.05, 0.45, dir.y);
        gl_FragColor = vec4(col, 1.0);
    `;

      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 1, size / 2, size / 2, size / 2);
      g.addColorStop(0.0, innerRgba);
      g.addColorStop(0.42, midRgba);
      g.addColorStop(1.0, outerRgba);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeMistCloudTex(size = 192) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;

      const puffs = [

        [0.66, 0.50, 0.30, 0.20], [0.48, 0.38, 0.28, 0.18],
        [0.54, 0.64, 0.32, 0.18],
      ];
      for (const [px, py, pr, pa] of puffs) {
        const g = ctx.createRadialGradient(px * size, py * size, 2, px * size, py * size, pr * size);
        g.addColorStop(0.0, `rgba(215, 228, 245, ${pa})`);
        g.addColorStop(0.55, `rgba(185, 204, 224, ${pa * 0.42})`);
        g.addColorStop(1.0, 'rgba(185, 204, 224, 0.0)');
        ctx.fillStyle = g;

    function applyUnitRimShader(mat) {
      if (!mat || !mat.isMeshStandardMaterial || mat.userData._hasRimShader) return;
      mat.userData._hasRimShader = true;
      mat.customProgramCacheKey = () => 'unit_fresnel_rim_v1';
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uRimColor = unitRimUniforms.uRimColor;
        shader.uniforms.uRimStrength = unitRimUniforms.uRimStrength;
        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            '#include <common>\nuniform vec3 uRimColor;\nuniform float uRimStrength;'
          )
          .replace(
            '#include <opaque_fragment>',
            `{
              float _rimNdotV = clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0);
              float _rimPow = pow(1.0 - _rimNdotV, 3.2) * uRimStrength;
              outgoingLight += uRimColor * _rimPow * (0.35 + 0.65 * diffuseColor.rgb);

          );

          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for (const mt of mats) {
            if (!mt) continue;
            if (isUnit) {
              applyUnitRimShader(mt);
              if (!mt.map && mt.isMeshStandardMaterial && !mt.userData._roughCohesed) {

                mt.roughness = THREE.MathUtils.clamp(mt.roughness, 0.46, 0.88);

    // Lightweight Procedural Web Audio SFX (zero external audio files, unlocks on first interaction)
    const SFX = (() => {
      let ctx = null;
      let masterGain = null;
      let noiseBuf = null;

      function ensure() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          masterGain = ctx.createGain();
          masterGain.gain.value = 0.24;
          masterGain.connect(ctx.destination);
          const len = Math.floor(ctx.sampleRate * 0.35);
          noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
          const data = noiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2.0 - 1.0;
        }
        return ctx;
      }

      function unlock() {
        try {
          const c = ensure();
          if (c && c.state === 'suspended') c.resume().catch(() => {});
        } catch {}
      }
      window.addEventListener('pointerdown', unlock, { passive: true });
      window.addEventListener('keydown', unlock, { passive: true });

      function activeCtx() {
        if (!chkSfx || !chkSfx.checked) return null;
        try {
          const c = ensure();
          if (!c || c.state !== 'running') return null;
          return c;
        } catch {
          return null;
        }
      }

      function playNoise(c, t, dur, filterType, freqStart, freqEnd, q, gainPeak) {
        const src = c.createBufferSource();
        src.buffer = noiseBuf;
        const flt = c.createBiquadFilter();
        flt.type = filterType;
        flt.Q.value = q;
        flt.frequency.setValueAtTime(freqStart, t);
        if (freqEnd !== freqStart) flt.frequency.exponentialRampToValueAtTime(Math.max(30, freqEnd), t + dur);
        const g = c.createGain();
        g.gain.setValueAtTime(Math.max(0.0001, gainPeak), t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(flt).connect(g).connect(masterGain);
        src.start(t);
        src.stop(t + dur + 0.01);
      }

      function playTone(c, t, dur, type, freqStart, freqEnd, gainPeak) {
        const osc = c.createOscillator();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(24, freqEnd), t + dur);
        const g = c.createGain();
        g.gain.setValueAtTime(Math.max(0.0001, gainPeak), t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g).connect(masterGain);
        osc.start(t);
        osc.stop(t + dur + 0.01);
      }

      return {
        playGun(cls) {
          const c = activeCtx();
          if (!c) return;
          const t = c.currentTime;
          if (cls === 'bow') {
            playTone(c, t, 0.09, 'triangle', 310, 140, 0.24);
            playNoise(c, t, 0.06, 'highpass', 2400, 1600, 1.0, 0.14);
          } else if (cls === 'shotgun') {
            playNoise(c, t, 0.15, 'bandpass', 950, 320, 0.7, 0.56);
            playTone(c, t, 0.16, 'sine', 140, 36, 0.52);
          } else if (cls === 'pistol') {
            playNoise(c, t, 0.08, 'bandpass', 1550, 620, 0.9, 0.42);
            playTone(c, t, 0.07, 'sine', 180, 58, 0.30);
          } else {
            playNoise(c, t, 0.075, 'bandpass', 1700, 680, 0.85, 0.38);
            playTone(c, t, 0.065, 'sine', 160, 50, 0.28);
          }
        },
        playMelee(heavy) {
          const c = activeCtx();
          if (!c) return;
          const t = c.currentTime;
          playNoise(c, t, heavy ? 0.15 : 0.10, 'bandpass', heavy ? 520 : 860, heavy ? 170 : 300, 1.8, heavy ? 0.36 : 0.24);
        },
        playHit(heavy, isMutant) {
          const c = activeCtx();
          if (!c) return;
          const t = c.currentTime;
          playTone(c, t, heavy ? 0.095 : 0.065, 'triangle', isMutant ? 118 : 155, isMutant ? 42 : 58, heavy ? 0.34 : 0.20);
          playNoise(c, t, 0.045, 'bandpass', 720, 340, 1.1, heavy ? 0.24 : 0.14);
        },
        playMonsterAttack(isSlam) {
          const c = activeCtx();
          if (!c) return;
          const t = c.currentTime;
          if (isSlam) {
            playTone(c, t, 0.20, 'sine', 108, 32, 0.50);
            playNoise(c, t, 0.16, 'lowpass', 380, 110, 0.9, 0.36);
          } else {
            playNoise(c, t, 0.11, 'bandpass', 640, 220, 1.5, 0.26);
          }
        },
        playDeathThud(shakeStrength) {
          const c = activeCtx();
          if (!c) return;
          const t = c.currentTime;
          const w = Math.min(1.0, Math.max(0.28, (shakeStrength || 0.06) / 0.24));
          playTone(c, t, 0.24, 'sine', 95, 30, 0.55 * w);
          playNoise(c, t, 0.18, 'lowpass', 260, 90, 0.8, 0.34 * w);
        },
      };
    })();

    const splatterTex = (() => {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);
      const blobs = [
        [64, 64, 34], [46, 52, 20], [82, 58, 18], [58, 84, 21],
        [76, 44, 15], [38, 72, 13], [90, 78, 12], [66, 36, 11],
        [26, 54, 7], [98, 50, 6], [42, 98, 7], [88, 96, 6], [62, 18, 5],
      ];
      for (const [bx, by, br] of blobs) {
        const g = ctx.createRadialGradient(bx, by, br * 0.15, bx, by, br);
        g.addColorStop(0, 'rgba(255,255,255,0.96)');
        g.addColorStop(0.68, 'rgba(255,255,255,0.82)');
        g.addColorStop(1, 'rgba(255,255,255,0.0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    })();

    function getDeathTheme(unit) {
      return DEATH_THEMES[unit.specId] || DEATH_THEMES._default;

    function prepareCorpseMaterials(unit) {
      if (unit.corpseMats) return;
      const list = [];
      unit.model.traverse((o) => {
        if (!(o.isMesh || o.isSkinnedMesh) || !o.material) return;
        const wasArr = Array.isArray(o.material);
        const srcArr = wasArr ? o.material : [o.material];
        const clonedArr = srcArr.map((mt) => {
          if (!mt) return mt;
          const c = mt.clone();
          if (c.userData && !c.userData._hasRimShader) applyUnitRimShader(c);
          list.push({
            mat: c,
            origColor: c.color ? c.color.clone() : null,
            origEmissive: c.emissive ? c.emissive.clone() : null,
            origEmissiveInt: ('emissiveIntensity' in c) ? c.emissiveIntensity : null,
            origRough: ('roughness' in c) ? c.roughness : null,
          });
          return c;
        });
        o.material = wasArr ? clonedArr : clonedArr[0];
      });
      unit.corpseMats = list;
    }

    function restoreCorpseMaterials(unit) {
      unit.hitFlash = 0;
      if (unit.corpseMats) {
        for (const entry of unit.corpseMats) {
          if (entry.origColor && entry.mat.color) entry.mat.color.copy(entry.origColor);
          if (entry.origEmissive && entry.mat.emissive) entry.mat.emissive.copy(entry.origEmissive);
          if (entry.origEmissiveInt !== null) entry.mat.emissiveIntensity = entry.origEmissiveInt;
          if (entry.origRough !== null) entry.mat.roughness = entry.origRough;
        }
      }
      if (unit.shadow) {
        const s = unit.shadow.baseRad * 2.0;
        unit.shadow.mesh.scale.set(s, s, 1);
        unit.shadow.mat.opacity = unit.shadow.baseOpacity;
      }
    }

    function disposeUnitCorpseMaterials(unit) {
      if (unit.corpseMats) {
        for (const entry of unit.corpseMats) entry.mat.dispose();
        unit.corpseMats = null;
      }
      if (unit.shadow) unit.shadow.mat.dispose();
    }

    function clearDeathFx() {

    function spawnBurstParticles(pos, dirBias, colors, count, speedScale = 1.0, lowDust = false) {
      for (let i = 0; i < count; i++) {
        const col = colors[i % colors.length];
        const mat = new THREE.MeshStandardMaterial({
          color: col, roughness: lowDust ? 0.92 : 0.42, metalness: 0.05,
          transparent: lowDust, opacity: lowDust ? 0.72 : 1.0,
        });
        const m = new THREE.Mesh(chunkGeo, mat);
        const sc = (lowDust ? 1.15 : 0.65) + Math.random() * 1.15;
        m.position.copy(pos);
        m.scale.setScalar(sc);
        m.rotation.set(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
        scene.add(m);

        const ang = Math.random() * Math.PI * 2;
        const hSpd = (lowDust ? 1.8 : 1.2) + Math.random() * (lowDust ? 2.6 : 3.2) * speedScale;
        const vx = Math.cos(ang) * hSpd + (dirBias ? dirBias.x * (1.2 + Math.random() * 1.5) : 0);
        const vz = Math.sin(ang) * hSpd + (dirBias ? dirBias.z * (1.2 + Math.random() * 1.5) : 0);
        const vy = lowDust ? (0.4 + Math.random() * 1.1) : (2.2 + Math.random() * 3.4 * speedScale);
        const maxLife = lowDust ? (0.42 + Math.random() * 0.28) : (0.90 + Math.random() * 0.65);
        deathParticles.push({
          mesh: m, vx, vy, vz,
          rx: (Math.random() - 0.5) * 14, ry: (Math.random() - 0.5) * 14,
          life: maxLife, maxLife, baseScale: sc, lowDust,
        });
      }
    }

    function spawnDeathEffect(target, attacker) {
      prepareCorpseMaterials(target);
      const theme = getDeathTheme(target);
      const away = attacker
        ? new THREE.Vector3().subVectors(target.group.position, attacker.group.position).setY(0)
        : new THREE.Vector3(0, 0, 0);
      if (away.lengthSq() > 1e-5) away.normalize();

      const origin = target.group.position.clone().add(new THREE.Vector3(0, target.height * 0.44, 0));
      spawnBurstParticles(origin, away, theme.colors, theme.count, Math.min(1.35, 0.85 + target.height * 0.14), false);

      // Evict oldest puddle if many corpses accumulate in endless waves
      let puddleCount = 0;
      for (const d of deathDecals) { if (d.kind === 'puddle') puddleCount++; }
      if (puddleCount >= MAX_DEATH_PUDDLES) {
        const idx = deathDecals.findIndex((d) => d.kind === 'puddle');
        if (idx !== -1) {
          scene.remove(deathDecals[idx].mesh);
          deathDecals[idx].mesh.material.dispose();
          deathDecals.splice(idx, 1);
        }
      }

      // Ground blood/ichor pool shifted forward slightly where corpse torso lands
      const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(target.group.quaternion);
      const poolShift = target.specId === 'mutant_arachnid_maw' ? 0.0 : 0.34 * (target.ringScale || 1.0);
      const poolMat = new THREE.MeshStandardMaterial({
        map: splatterTex, color: theme.poolColor, transparent: true, opacity: 0.88,
        roughness: 0.24, metalness: 0.06, depthWrite: false,
        polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
      });
      const pool = new THREE.Mesh(contactShadowGeo, poolMat);
      pool.rotation.set(-Math.PI / 2, Math.random() * Math.PI * 2, 0);
      pool.position.set(
        target.group.position.x + fwd.x * poolShift,
        0.008,
        target.group.position.z + fwd.z * poolShift
      );
      pool.scale.setScalar(0.22);
      pool.receiveShadow = true;
      scene.add(pool);
      deathDecals.push({
        kind: 'puddle', mesh: pool, targetScale: theme.poolRad * 2.0, age: 0.0, growDur: 1.35,
      });

      pendingDeathImpacts.push({
        timer: theme.impactDelay,
        unit: target,
        shift: poolShift,
        fwd: fwd.clone(),
        theme,
      });
    }

    function playClip(unit, clipName, loopOnce = false, fade = 0.16, clipSpeed = 1.0, exclusive = false) {
      if (!clipName) return null;
      const clip = unit.clipsByName[clipName];
      if (!clip) return null;
      if (unit.currentClip === clipName && !loopOnce) {
        if (unit.currentAction) {
          unit.currentAction.enabled = true;
          unit.currentAction.setEffectiveWeight(1.0);
          unit.currentAction.timeScale = clipSpeed;
        }
        return unit.currentAction;
      }

      const nextAct = unit.mixer.clipAction(clip);
      if (exclusive) {
        for (const c of Object.values(unit.clipsByName)) {
          const existing = unit.mixer.existingAction(c);
          if (existing && existing !== nextAct && existing.isRunning()) {
            existing.fadeOut(fade);
          }
        }
      }
      nextAct.reset();
      nextAct.enabled = true;
      nextAct.setEffectiveWeight(1.0);
      nextAct.timeScale = clipSpeed;
      if (loopOnce) {
        nextAct.setLoop(THREE.LoopOnce, 1);
        nextAct.clampWhenFinished = true;
      } else {
        nextAct.setLoop(THREE.LoopRepeat, Infinity);
        nextAct.clampWhenFinished = false;
      }
      nextAct.play();
      if (!exclusive && unit.currentAction && unit.currentAction !== nextAct) {
        unit.currentAction.crossFadeTo(nextAct, fade, false);
      }
      unit.currentAction = nextAct;
      unit.currentClip = clipName;
      return nextAct;
    }

    function pickSurvivorClips(weaponId, availableClips) {
      const w = WEAPONS[weaponId] || WEAPONS.m4;
      const has = (name) => Boolean(availableClips[name]);
      const rWalk = has('Rifle_Walk_Cycle') ? 'Rifle_Walk_Cycle' : 'Rifle_Idle_Ready';
      const rRun = has('Rifle_Run_Cycle') ? 'Rifle_Run_Cycle' : rWalk;
      if (w.cls === 'pistol') {
        return {
          idle: has('Pistol_Idle_Ready') ? 'Pistol_Idle_Ready' : 'Rifle_Idle_Ready',
          aim: has('Pistol_Aim_ADS') ? 'Pistol_Aim_ADS' : 'Pistol_Idle_Ready',
          walk: rWalk,
          run: rRun,
          attack: has('Pistol_Shoot_Recoil') ? 'Pistol_Shoot_Recoil' : 'Rifle_Shoot_Recoil',
          skill: 'Pistol_Reload_Tactical',
          hit: 'Hit_React',
          death: 'Zombie_Death_Fall',
        };
      }
      if (w.cls === 'bow') {
        return {
          idle: has('Bow_Idle_Ready') ? 'Bow_Idle_Ready' : 'Rifle_Idle_Ready',
          aim: has('Bow_Aim_Draw') ? 'Bow_Aim_Draw' : 'Bow_Idle_Ready',
          walk: rWalk,
          run: rRun,
          attack: has('Bow_Shoot_Release') ? 'Bow_Shoot_Release' : 'Bow_Aim_Draw',
          skill: 'Bow_Aim_Draw',
          hit: 'Hit_React',
          death: 'Zombie_Death_Fall',
        };
      }
      if (w.cls === 'melee') {
        const mIdle = has('Melee_Idle_Ready') ? 'Melee_Idle_Ready' : 'Rifle_Idle_Ready';
        const mWalk = has('Melee_Walk_Cycle') ? 'Melee_Walk_Cycle' : rWalk;
        const mRun  = has('Melee_Run_Cycle') ? 'Melee_Run_Cycle' : rRun;
        return {
          idle: mIdle,
          aim: mIdle,
          walk: mWalk,
          run: mRun,
          attack: has('Melee_Swing') ? 'Melee_Swing' : 'Rifle_Shoot_Recoil',
          skill: has('Melee_Heavy_Slash') ? 'Melee_Heavy_Slash' : 'Melee_Swing',
          hit: 'Hit_React',
          death: 'Zombie_Death_Fall',
        };
      }
      return {
        idle: 'Rifle_Idle_Ready',
        aim: 'Rifle_Aim_ADS',
        walk: rWalk,
        run: rRun,
        attack: 'Rifle_Shoot_Recoil',
        skill: 'Rifle_Reload_Tactical',
        hit: 'Hit_React',
        death: 'Zombie_Death_Fall',
      };
    }

    function layoutArenaPositions() {
      clearDeathFx();
      const dist = parseFloat(sliderDist.value);
      const halfD = dist * 0.5;
      const survs = units.filter((u) => u.team === 'survivor');
      const enms = units.filter((u) => u.team === 'enemy');
      const isApoc = selEnvMode.value === 'apocalypse';

      const placeTeam = (list, baseX, dirSign) => {
        const hasLarge = list.some((u) => (u.bodyRadius || 0.38) >= 0.55);
        const perRow = isApoc ? (hasLarge ? 4 : 5) : 5;
        const maxHalfZ = isApoc ? 3.05 : 6.5;
        list.forEach((u, i) => {
          const row = Math.floor(i / perRow);
          const idxInRow = i % perRow;
          const rowLen = Math.min(perRow, list.length - row * perRow);
          const zSpan = maxHalfZ * 2.0;
          const zStep = rowLen > 1 ? Math.min(isApoc ? 1.95 : 2.35, zSpan / (rowLen - 1)) : 0;
          const staggerZ = (row % 2 === 1 && rowLen < perRow) ? 0.35 : 0.0;
          const z = THREE.MathUtils.clamp((idxInRow - (rowLen - 1) * 0.5) * zStep + staggerZ, -maxHalfZ, maxHalfZ);
          const x = THREE.MathUtils.clamp(baseX + dirSign * row * 2.05, -20.5, 20.5);
          u.group.position.set(x, 0, z);
          u.group.rotation.set(0, dirSign < 0 ? Math.PI * 0.5 : -Math.PI * 0.5, 0);
          u.hp = u.maxHp;
          u.dead = false;
          u.deadTimer = 0;
          u.hitFlash = 0;
          u.manualHold = false;
          u.lockTimer = 0;
          u.attackCount = 0;
          u.pendingHit = null;
          u.vel.set(0, 0, 0);
          u.cooldown = Math.random() * 0.25;
          restoreCorpseMaterials(u);
          u.hudEl.classList.remove('dead');
          u.hudEl.style.opacity = '';
          u.hudEl.style.display = 'block';
          const startAct = playClip(u, u.team === 'survivor' ? (u.anims.aim || u.anims.idle) : u.anims.walk, false, 0.08, 1.0, true);
          if (startAct && u.team === 'enemy') {
            startAct.time = Math.random() * (startAct.getClip().duration || 1.0);
          }
        });
      };

      placeTeam(survs, -halfD, -1); // face +X (yaw = +PI/2)
      placeTeam(enms,  +halfD, +1); // face -X (yaw = -PI/2)
      battleOver = false;
      resultBanner.classList.remove('show');
    }

    function clearArena() {
      clearDeathFx();
      for (const u of units) {
        disposeUnitCorpseMaterials(u);
        scene.remove(u.group);
        u.hudEl.remove();
      }
      units.length = 0;
      for (const v of activeVfx) scene.remove(v.mesh);
      activeVfx.length = 0;
      for (const p of activeProjectiles) scene.remove(p.mesh);
      activeProjectiles.length = 0;
      selectedUid = null;
      selectRing.visible = false;
      battleOver = false;
      resultBanner.classList.remove('show');
      refreshRosterUI();
    }

    async function spawnTimedVfx(glbUrl, worldPos, dirVec, { groundFlat = false, scale = 1.0, life = 0.42 } = {}) {
      if (!chkVfx.checked || !glbUrl) return;
      try {
        const gltf = await loadGLB(glbUrl);
        const mesh = gltf.scene.clone(true);
        mesh.position.copy(worldPos);
        mesh.scale.setScalar(scale);

        if (!groundFlat && dirVec && dirVec.lengthSq() > 1e-5) {
          const target = worldPos.clone().add(dirVec);
          mesh.lookAt(target);
          // Blender +Z forward assets become +Y forward in glTF; rotate +90deg around local X to aim along +Z!
          mesh.rotateX(Math.PI * 0.5);
        }
        scene.add(mesh);
        activeVfx.push({ mesh, life, maxLife: life, startScale: scale });
      } catch (err) {
        console.warn('VFX load error:', glbUrl, err);
      }
    }

    function spawnProjectile(fromPos, toPos, colorHex, speed = 22.0, onImpact = null) {
      const dir = new THREE.Vector3().subVectors(toPos, fromPos);
      const dist = dir.length();
      if (dist < 0.05) { if (onImpact) onImpact(); return; }
      dir.normalize();

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.028, 0.018, 0.45, 6),
        new THREE.MeshBasicMaterial({ color: colorHex })
      );
      mesh.position.copy(fromPos);
      mesh.lookAt(toPos);
      mesh.rotateX(Math.PI * 0.5);
      scene.add(mesh);
      activeProjectiles.push({ mesh, dir, speed, distLeft: dist, onImpact });
    }

    function getMuzzleWorldPos(unit) {
      if (unit.muzzleNode) {
        const p = new THREE.Vector3();
        unit.muzzleNode.getWorldPosition(p);
        return p;
      }
      const sock = unit.model.getObjectByName(unit.weaponClass === 'bow' ? 'WeaponSocket_L' : 'WeaponSocket_R');
      if (sock) {
        const p = new THREE.Vector3(0, unit.muzzleZ, -0.04);
        sock.localToWorld(p);
        return p;
      }
      const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(unit.group.quaternion);
      return unit.group.position.clone().add(new THREE.Vector3(0, 1.38, 0)).addScaledVector(fwd, 0.55);
    }

    function getEnemyAttackOrigin(unit) {
      const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(unit.group.quaternion);
      if (unit.vfxMode === 'ground_slam') {
        const lHand = unit.model.getObjectByName('Arm_L_Hand');
        const rHand = unit.model.getObjectByName('Arm_R_Hand');
        if (lHand && rHand) {
          const pL = new THREE.Vector3(); lHand.getWorldPosition(pL);
          const pR = new THREE.Vector3(); rHand.getWorldPosition(pR);
          return new THREE.Vector3(0.5 * (pL.x + pR.x), 0.03, 0.5 * (pL.z + pR.z)).addScaledVector(fwd, 0.25);
        }
        return unit.group.position.clone().addScaledVector(fwd, 1.0).setY(0.03);
      }
      if (unit.vfxMode === 'scythe_forward') {
        const sb = unit.model.getObjectByName('Scythe_Blade');
        if (sb) {
          const p = new THREE.Vector3(); sb.getWorldPosition(p);
          return p.addScaledVector(fwd, 0.25);
        }
      }
      const head = unit.model.getObjectByName('Head') || unit.model.getObjectByName('mixamorig:Head');
      if (head) {
        const p = new THREE.Vector3(); head.getWorldPosition(p);
        return p.addScaledVector(fwd, 0.24);
      }
      return unit.group.position.clone().add(new THREE.Vector3(0, unit.height * 0.65, 0)).addScaledVector(fwd, 0.45);
    }

    function nearestLivingEnemy(unit) {
      let best = null;
      let bestD = Infinity;
      for (const other of units) {
        if (other.dead || other.team === unit.team) continue;
        const d = unit.group.position.distanceTo(other.group.position);
        if (d < bestD) { bestD = d; best = other; }
      }
      return { target: best, dist: bestD };
    }

    function applyDamage(target, amount, attacker, pushImpulse = 0.0) {
      if (target.dead) return;
      const immortal = selCombatMode.value === 'immortal';
      if (!immortal) {
        target.hp = Math.max(0, target.hp - amount);
      }
      const hitPos = target.group.position.clone().add(new THREE.Vector3(0, target.height * 0.62, 0));
      spawnFloatingDamage(hitPos, amount, attacker.team === 'survivor' ? '#fef08a' : '#f87171');
      if (chkVfx.checked) {
        spawnTimedVfx('../output/vfx/vfx_impact_blood.glb', hitPos, new THREE.Vector3(0, 1, 0), { groundFlat: true, scale: 0.9, life: 0.28 });
      }
      if (pushImpulse > 0 && attacker) {
        const kb = new THREE.Vector3().subVectors(target.group.position, attacker.group.position).setY(0);
        if (kb.lengthSq() > 1e-5) {
          kb.normalize();
          const massFactor = (target.maxHp > 400) ? 0.35 : 1.0;
          target.vel.addScaledVector(kb, pushImpulse * massFactor);
        }
      }
      SFX.playHit(amount >= 40, target.kind === 'mutant');
      if (!immortal && target.hp <= 0) {
        target.hitFlash = 0;
        if (target.corpseMats) {
          for (const entry of target.corpseMats) {
            if (entry.origEmissive && entry.mat.emissive) entry.mat.emissive.copy(entry.origEmissive);
            if (entry.origEmissiveInt !== null) entry.mat.emissiveIntensity = entry.origEmissiveInt;
          }
        }
        target.dead = true;
        target.deadTimer = 0;
        target.pendingHit = null;
        target.lockTimer = 0;
        target.stateText = 'Tumbang';
        target.hudEl.classList.add('dead');
        spawnDeathEffect(target, attacker);
        playClip(target, target.anims.death || target.anims.hit, true, 0.14, 1.0, true);
      } else {
        prepareCorpseMaterials(target);
        target.hitFlash = 0.095;
        if (amount >= 42 || pushImpulse >= 2.2) {
          hitStopTimer = Math.max(hitStopTimer, 0.028);
        }
        if (target.lockTimer <= 0 && target.kind === 'zombie') {
          // Zombies flinch on hit if not mid-skill
          playClip(target, target.anims.hit, true, 0.08, 1.15);
          target.lockTimer = 0.24;
        }
      }
    }

    function resolveUnitSeparation(dt) {
      if (dt <= 0) return;
      const n = units.length;
      const zLimit = selEnvMode.value === 'apocalypse' ? 4.2 : 14.8;
      for (let i = 0; i < n; i++) {
        const a = units[i];
        if (a.dead) continue;
        const rA = a.bodyRadius || 0.38;
        for (let j = i + 1; j < n; j++) {
          const b = units[j];
          if (b.dead) continue;
          const rB = b.bodyRadius || 0.38;
          const sameTeam = a.team === b.team;
          const minDist = (rA + rB) * (sameTeam ? 0.90 : 0.78);
          let dx = a.group.position.x - b.group.position.x;
          let dz = a.group.position.z - b.group.position.z;
          const d2 = dx * dx + dz * dz;
          if (d2 >= minDist * minDist) continue;

          let dist = Math.sqrt(d2);
          if (dist < 1e-4) {
            const ang = (a.uid * 1.618 + b.uid * 2.718) % 6.283;
            dx = Math.cos(ang);
            dz = Math.sin(ang);
            dist = 1.0;
          }
          const overlap = minDist - dist;
          const push = Math.min(0.085, overlap * Math.min(1.0, 7.5 * dt));
          const nx = dx / dist;
          const nz = dz / dist;
          const wA = 1.0 / (0.4 + rA * rA);
          const wB = 1.0 / (0.4 + rB * rB);
          const wSum = wA + wB;
          const fA = wA / wSum;
          const fB = wB / wSum;
          a.group.position.x = THREE.MathUtils.clamp(a.group.position.x + nx * push * fA, -21, 21);
          a.group.position.z = THREE.MathUtils.clamp(a.group.position.z + nz * push * fA, -zLimit, zLimit);
          b.group.position.x = THREE.MathUtils.clamp(b.group.position.x - nx * push * fB, -21, 21);
          b.group.position.z = THREE.MathUtils.clamp(b.group.position.z - nz * push * fB, -zLimit, zLimit);
        }
      }
    }

    function computeMoveDir(unit, dirToTarget) {
      let fx = 0.0, fz = 0.0;
      const rU = unit.bodyRadius || 0.38;
      for (const ally of units) {
        if (ally === unit || ally.dead || ally.team !== unit.team) continue;
        const rx = ally.group.position.x - unit.group.position.x;
        const rz = ally.group.position.z - unit.group.position.z;
        const d2 = rx * rx + rz * rz;
        const senseDist = (rU + (ally.bodyRadius || 0.38)) * 1.55;
        if (d2 < 1e-6 || d2 > senseDist * senseDist) continue;
        const d = Math.sqrt(d2);
        const fwdDot = (rx * dirToTarget.x + rz * dirToTarget.z) / d;
        if (fwdDot <= 0.32) continue;
        const crossY = dirToTarget.x * rz - dirToTarget.z * rx;
        const sideSign = Math.abs(crossY) > 0.02
          ? (crossY >= 0 ? -1.0 : 1.0)
          : ((unit.uid % 2 === 0) ? 1.0 : -1.0);
        const w = (1.0 - d / senseDist) * (0.45 + 0.55 * fwdDot);
        fx += (-dirToTarget.z) * sideSign * w;
        fz += (dirToTarget.x) * sideSign * w;
      }
      const out = new THREE.Vector3(dirToTarget.x + fx * 1.15, 0, dirToTarget.z + fz * 1.15);
      return out.lengthSq() > 1e-6 ? out.normalize() : dirToTarget;
    }

    const _turnDummy = new THREE.Object3D();
    function updateUnitAI(unit, dt) {
      unit.mixer.update(dt);

      // Apply damped knockback / lunge velocity impulse & keep inside street/arena
      if (unit.vel.lengthSq() > 1e-5 && dt > 0) {
        const zLimit = selEnvMode.value === 'apocalypse' ? 4.2 : 15.0;
        unit.group.position.addScaledVector(unit.vel, dt);
        unit.group.position.x = THREE.MathUtils.clamp(unit.group.position.x, -21, 21);
        unit.group.position.z = THREE.MathUtils.clamp(unit.group.position.z, -zLimit, zLimit);
        unit.vel.multiplyScalar(Math.exp((unit.dead ? -13.0 : -8.5) * dt));
      }

      if (!unit.dead && unit.hitFlash > 0 && dt > 0 && unit.corpseMats) {
        unit.hitFlash = Math.max(0.0, unit.hitFlash - dt);
        const k = unit.hitFlash / 0.095;
        const flashCol = unit.team === 'survivor' ? _hitFlashColSurv : _hitFlashColEnemy;
        for (const entry of unit.corpseMats) {
          if (!entry.mat.emissive) continue;
          if (k > 0.001) {
            if (entry.origEmissive) entry.mat.emissive.copy(entry.origEmissive).lerp(flashCol, k);
            else entry.mat.emissive.copy(flashCol);
            entry.mat.emissiveIntensity = Math.max(entry.origEmissiveInt || 0.0, 1.35 * k);
          } else {
            if (entry.origEmissive) entry.mat.emissive.copy(entry.origEmissive);
            entry.mat.emissiveIntensity = entry.origEmissiveInt ?? 0.0;
          }
        }
      }

      if (unit.dead) {
        if (dt > 0) {
          unit.deadTimer += dt;
          const t = Math.min(1.0, unit.deadTimer / 1.35);
          if (unit.corpseMats) {
            for (const entry of unit.corpseMats) {
              if (entry.origColor && entry.mat.color) {
                entry.mat.color.copy(entry.origColor).multiplyScalar(1.0 - 0.32 * t);
              }
              if (entry.origEmissiveInt !== null) {
                entry.mat.emissiveIntensity = entry.origEmissiveInt * (1.0 - 0.90 * t);
              }
              if (entry.origRough !== null) {
                entry.mat.roughness = Math.min(1.0, entry.origRough + 0.14 * t);
              }
            }
          }
          if (unit.shadow) {
            const sc = unit.shadow.baseRad * 2.0 * (1.0 + 0.18 * t);
            unit.shadow.mesh.scale.set(sc, sc, 1);
            unit.shadow.mat.opacity = unit.shadow.baseOpacity * (1.0 - 0.32 * t);
          }
        }
        return;
      }

      // Resolve synchronized melee/monster strike impact at animation strike frame
      if (unit.pendingHit && dt > 0) {
        unit.pendingHit.timer -= dt;
        if (unit.pendingHit.timer <= 0) {
          const ph = unit.pendingHit;
          unit.pendingHit = null;
          if (ph.kind === 'melee_surv') {
            const muz = getMuzzleWorldPos(unit);
            const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(unit.group.quaternion);
            spawnTimedVfx('../output/vfx/vfx_melee_slash.glb', muz, fwd, { groundFlat: false, scale: unit.slashScale || 1.05, life: 0.28 });
            SFX.playMelee(ph.push > 2.0);
            if (ph.push > 2.0) triggerFlashLight(muz, 0xffe4b5, 3.0, 0.06);
            if (ph.target && !ph.target.dead && unit.group.position.distanceTo(ph.target.group.position) <= unit.range + 1.3) {
              applyDamage(ph.target, ph.dmg, unit, ph.push || 1.6);
            }
          } else if (ph.kind === 'enemy_melee') {
            const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(unit.group.quaternion);
            const o2 = getEnemyAttackOrigin(unit);
            spawnTimedVfx(unit.vfxGlb, o2, fwd, { groundFlat: ph.isSlam, scale: (ph.isSlam ? 1.1 : 1.0) * (unit.vfxScale || 1.0), life: 0.48 });
            triggerFlashLight(o2, unit.vfxProjColor || (ph.isSlam ? 0xff9944 : 0xdc2626), ph.isSlam ? 5.2 : 3.2, 0.085);
            SFX.playMonsterAttack(ph.isSlam);
            if (ph.target && !ph.target.dead && unit.group.position.distanceTo(ph.target.group.position) <= ph.maxDist) {
              applyDamage(ph.target, ph.dmg, unit, ph.isSlam ? 3.2 : 1.8);
            }
          }
        }
      }

      if (unit.manualHold) return;
      if (unit.cooldown > 0) unit.cooldown -= dt;
      if (unit.lockTimer > 0) {
        unit.lockTimer -= dt;
        return;
      }

      const { target, dist } = nearestLivingEnemy(unit);
      if (!target) {
        unit.stateText = 'Menang / Idle';
        playClip(unit, unit.anims.idle, false, 0.22);
        return;
      }

      const dir = new THREE.Vector3(
        target.group.position.x - unit.group.position.x,
        0,
        target.group.position.z - unit.group.position.z
      );
      if (dir.lengthSq() > 1e-6) dir.normalize();

      const lookAtDir = (vec) => {
        if (vec.lengthSq() <= 1e-6) return;
        const lp = new THREE.Vector3(
          unit.group.position.x + vec.x,
          unit.group.position.y,
          unit.group.position.z + vec.z
        );
        _turnDummy.position.copy(unit.group.position);
        _turnDummy.lookAt(lp);
        unit.group.quaternion.slerp(_turnDummy.quaternion, Math.min(1.0, dt * 11.0));
      };

      if (unit.team === 'enemy') {
        const useSkill = (unit.attackCount % 2 === 1) && Boolean(unit.anims.skill);
        const engageRange = useSkill ? unit.skillRange : unit.range;

        if (dist > engageRange) {
          const isSprint = (dist > engageRange + 3.0) && unit.anims.run && (unit.anims.run !== unit.anims.walk);
          const moveClip = isSprint ? unit.anims.run : unit.anims.walk;
          const moveSpd = isSprint ? (unit.sprintSpeed || unit.speed * 1.45) : unit.speed;
          const clipObj = unit.clipsByName[moveClip];
          const clipDur = (clipObj && clipObj.duration) || 1.0;
          const strideLen = (isSprint && unit.runStride) ? unit.runStride : (unit.walkStride || 0.90);
          const clipScale = THREE.MathUtils.clamp(((moveSpd * clipDur) / strideLen) * (unit.animJitter || 1.0), 0.65, 1.85);
          const moveDir = computeMoveDir(unit, dir);
          lookAtDir(moveDir);
          unit.group.position.addScaledVector(moveDir, moveSpd * dt);
          unit.stateText = `${isSprint ? 'Berlari' : 'Berjalan'} (${dist.toFixed(1)}m)`;
          playClip(unit, moveClip, false, 0.16, clipScale);
        } else if (unit.cooldown <= 0) {
          lookAtDir(dir);
          unit.attackCount++;
          const clip = useSkill ? unit.anims.skill : unit.anims.attack;
          const act = playClip(unit, clip, true, 0.12, 1.05);
          const dur = act ? Math.min(1.35, act.getClip().duration / 1.05) : 0.72;
          unit.lockTimer = dur * 0.78;
          unit.cooldown = Math.max(dur * 0.86, unit.cd);
          unit.stateText = useSkill ? 'Skill Serang!' : 'Menyerang!';

          const dmg = useSkill ? unit.skillDmg : unit.dmg;
          const origin = getEnemyAttackOrigin(unit);
          if (useSkill && unit.skillRange > 3.5 && unit.vfxProjColor) {
            spawnTimedVfx(unit.vfxGlb, origin, dir, { groundFlat: false, scale: 0.95 * (unit.vfxScale || 1.0), life: 0.45 });
            triggerFlashLight(origin, unit.vfxProjColor || 0x84cc16, 4.4, 0.08);
            SFX.playMonsterAttack(false);
            const hitPt = target.group.position.clone().add(new THREE.Vector3(0, 1.15, 0));
            spawnProjectile(origin, hitPt, unit.vfxProjColor, 14.0, () => applyDamage(target, dmg, unit, 1.4));
          } else {
            const isSlam = (unit.vfxMode === 'ground_slam');
            if (dist > engageRange * 0.65) {
              unit.vel.addScaledVector(dir, isSlam ? 2.4 : 2.1);
            }
            unit.pendingHit = {
              kind: 'enemy_melee',
              timer: dur * 0.40,
              target,
              dmg,
              isSlam,
              maxDist: engageRange + 1.25,
            };
          }
        } else {
          lookAtDir(dir);
          unit.stateText = 'Siap Serang';
          playClip(unit, unit.anims.idle, false, 0.16);
        }
      } else {
        // Survivor AI: dynamic Run when far -> Walk on approach -> Combo Slash / Crisp Gunfire
        const shouldAdvance = (unit.weaponClass === 'melee') || (selSurvBehavior.value === 'advance');
        if (dist > unit.range && shouldAdvance) {
          const isSprint = (dist > unit.range + 2.6) && Boolean(unit.anims.run);
          const moveClip = isSprint ? unit.anims.run : unit.anims.walk;
          const moveSpd = isSprint ? 3.55 : 2.15;
          const clipObj = unit.clipsByName[moveClip];
          const clipDur = (clipObj && clipObj.duration) || 1.0;
          const strideLen = isSprint ? 1.60 : 1.07;
          const clipScale = THREE.MathUtils.clamp(((moveSpd * clipDur) / strideLen) * (unit.animJitter || 1.0), 0.70, 1.85);
          const moveDir = computeMoveDir(unit, dir);
          lookAtDir(moveDir);
          unit.group.position.addScaledVector(moveDir, moveSpd * dt);
          unit.stateText = `${isSprint ? 'Lari' : 'Maju'} (${dist.toFixed(1)}m)`;
          playClip(unit, moveClip, false, 0.14, clipScale);
        } else if (dist <= unit.range && unit.cooldown <= 0) {
          lookAtDir(dir);
          unit.attackCount++;
          const isHeavyMelee = (unit.weaponClass === 'melee') && (unit.attackCount % 2 === 0) && Boolean(unit.anims.skill);
          const atkClip = isHeavyMelee ? unit.anims.skill : unit.anims.attack;
          const act = playClip(unit, atkClip, true, 0.10, unit.weaponClass === 'melee' ? 1.10 : 1.15);
          const rawDur = act ? act.getClip().duration : 0.45;
          const dur = unit.weaponClass === 'melee' ? Math.min(1.05, rawDur / 1.10) : Math.min(0.42, rawDur * 0.68);
          unit.lockTimer = dur * (unit.weaponClass === 'melee' ? 0.78 : 0.62);
          unit.cooldown = unit.weaponClass === 'melee' ? Math.max(dur * 0.85, unit.cd) : unit.cd;
          unit.stateText = unit.weaponClass === 'melee' ? (isHeavyMelee ? 'Tebasan Berat!' : 'Ayun Senjata!') : 'Menembak!';

          const muz = getMuzzleWorldPos(unit);
          const aimPt = target.group.position.clone().add(new THREE.Vector3(0, target.height * 0.55, 0));
          if (unit.weaponClass === 'melee') {
            if (dist > unit.range * 0.65) {
              unit.vel.addScaledVector(dir, isHeavyMelee ? 2.8 : 2.2);
            }
            unit.pendingHit = {
              kind: 'melee_surv',
              timer: dur * 0.40,
              target,
              dmg: isHeavyMelee ? unit.dmg * 1.28 : unit.dmg,
              push: isHeavyMelee ? 2.8 : 1.6,
            };
          } else {
            spawnTimedVfx(`../output/vfx/vfx_${unit.vfxId}.glb`, muz, dir, { groundFlat: false, scale: 1.05, life: 0.18 });
            triggerFlashLight(muz, unit.weaponClass === 'bow' ? 0xf87171 : 0xffcc66, unit.weaponClass === 'bow' ? 2.4 : 5.8, 0.065);
            SFX.playGun(unit.weaponClass);
            const pColor = unit.weaponClass === 'bow' ? 0xf87171 : 0xffe680;
            spawnProjectile(muz, aimPt, pColor, unit.weaponClass === 'bow' ? 20.0 : 32.0, () => applyDamage(target, unit.dmg, unit, unit.weaponClass === 'bow' ? 1.0 : 0.45));
          }
        } else {
          lookAtDir(dir);
          unit.stateText = dist <= unit.range ? 'Membidik' : `Siaga (${dist.toFixed(1)}m)`;
          playClip(unit, unit.anims.aim || unit.anims.idle, false, 0.16);
        }
      }
    }

    // -----------------------------------------------------------------------
    // 7. ROSTER UI, INSPECTOR, PRESETS & CAMERA
    // -----------------------------------------------------------------------
    function refreshRosterUI() {
      document.getElementById('unit-count').textContent = `${units.length}`;
      rosterListEl.innerHTML = '';
      for (const u of units) {
        const item = document.createElement('div');
        item.className = 'roster-item' + (u.uid === selectedUid ? ' selected' : '');
        item.innerHTML = `
          <div style="display:flex;align-items:center;gap:7px;min-width:0;">
            <span class="roster-dot ${u.kind}"></span>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;">${u.shortName}</span>
          </div>
          <button class="sm danger" style="padding:2px 6px;flex:0 0 auto;">✕</button>
        `;
        item.addEventListener('click', (e) => {
          if (e.target.tagName === 'BUTTON') return;
          selectUnit(u.uid);
        });
        item.querySelector('button').addEventListener('click', () => removeUnit(u.uid));
        rosterListEl.appendChild(item);
      }
      updateInspectorUI();
    }

    function selectUnit(uid) {
      selectedUid = uid;
      for (const u of units) {
        u.hudEl.classList.toggle('selected', u.uid === uid);
      }
      refreshRosterUI();
    }

    function removeUnit(uid) {
      const idx = units.findIndex((u) => u.uid === uid);
      if (idx === -1) return;
      const u = units[idx];
      disposeUnitCorpseMaterials(u);
      scene.remove(u.group);
      u.hudEl.remove();
      units.splice(idx, 1);
      if (selectedUid === uid) selectedUid = units[0]?.uid ?? null;
      refreshRosterUI();
    }

    function updateInspectorUI() {
      const u = units.find((x) => x.uid === selectedUid);
      if (!u) {
        inspectorBox.style.display = 'none';
        selectRing.visible = false;
        return;
      }
      inspectorBox.style.display = 'flex';
      inspNameEl.textContent = u.shortName;
      selRawClip.innerHTML = '';
      for (const name of Object.keys(u.clipsByName).sort()) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        selRawClip.appendChild(opt);
      }
    }

    async function loadPreset(presetKey) {
      const p = PRESETS[presetKey];
      if (!p) return;
      sliderDist.value = p.dist;
      distVal.textContent = `${p.dist} m`;
      clearArena();
      showToast('Memuat model 3D & animasi...', '#38bdf8', 2500);
      await Promise.all([
        ...p.surv.map((s) => spawnSurvivor(s.id, s.weapon || 'default')),
        ...p.enm.map((eid) => spawnEnemy(eid)),
      ]);
      layoutArenaPositions();
      if (units.length > 0) selectUnit(units[0].uid);
      showToast(`Preset siap! Jarak awal ${p.dist} m — zombie/mutant berjalan mendekati survivor.`, '#22c55e', 2800);
    }

    function setCameraPreset(mode) {
      followCam = (mode === 'follow');
      const d = parseFloat(sliderDist.value);
      if (mode === 'arena') {
        camera.position.set(0, 6.2, Math.max(11.5, d * 1.05));
        controls.target.set(0, 1.0, 0);
      } else if (mode === 'side') {
        camera.position.set(0, 2.8, Math.max(13.0, d * 1.15));
        controls.target.set(0, 1.0, 0);
      } else if (mode === 'close') {
        camera.position.set(0, 2.2, 5.8);
        controls.target.set(0, 1.0, 0);
      } else if (mode === 'follow') {
        const u = units.find((x) => x.uid === selectedUid) || units[0];
        if (u) {
          controls.target.copy(u.group.position).add(new THREE.Vector3(0, 1.0, 0));
          camera.position.copy(controls.target).add(new THREE.Vector3(2.8, 1.8, 4.2));
        }
      }
    }

    document.getElementById('toggle-sidebar').addEventListener('click', () => document.body.classList.remove('sidebar-collapsed'));

    // Inspector animation preview buttons
    document.querySelectorAll('[data-anim-role]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const u = units.find((x) => x.uid === selectedUid);
        if (!u) return;

        u.manualHold = (role === 'idle' || role === 'death');

    document.getElementById('btn-play-raw').addEventListener('click', () => {
